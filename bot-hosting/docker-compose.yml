# Run on any VPS: docker compose up -d --build
services:
  bot-node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_BASE: ${API_BASE:-https://your-jilowa-chat.vercel.app}
      CHAT_ID: ${CHAT_ID:-}
    # Uncomment to expose webhook server instead of bot.js:
    # command: ["npm", "run", "webhook"]
    # ports:
    #   - "8080:8080"

